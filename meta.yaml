package:
  name: gsaeval      # 包的名称（必须全小写）
  version: "1.0.0"      # 包的版本号

source:
  path: .

build:
  number: 0             # 构建号，如果版本没变但重新打包，将此数字加 1
  # script: "{{ PYTHON }} -m pip install . -vv" # 如果是极简 Python 包，可以直接在这里写安装命令，无需 build.sh

requirements:
  host:                 # 编译环境依赖（指定架构相关的依赖，如 Python）
    - python >=3.10
    - pip
  run:                  # 运行时依赖（用户安装此包时会被自动下载的依赖）
    - python >=3.10
    - numpy ==1.22
    - pandas ==2.0.3
    - stringtie
    - mash
    - regtools
    - gffread
    - intervaltree>=3.1.0,<4.0.0
    - matplotlib==3.7.1
    - matplotlib-venn==1.1.2
    - pybedtools==0.12.0
    - pysam==0.19.1
    - scipy==1.8.0
    - seaborn==0.13.2
    - tabulate==0.9.0
    - pathlib==1.0.1
    - biopython==1.79
    - gffutils==0.11.0
test:
  imports:
    - GSAeval        # 测试安装后是否能成功 import
  commands:
    - GSAeval --help # 也可以添加命令行测试

about:
  home: https://github.com/Mavis-Mai/GSAeval
  license: MIT
  summary: "GSAeval: A novel algorithm/toolkit assessing genome annotation accuracy through splice junction pattern analysis"
